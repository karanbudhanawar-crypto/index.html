<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#202329">
<title>NovaCalc Scientific</title>
<style>
:root{--shell:#292c32;--shell2:#101216;--lcd:#d9e2dc;--ink:#18231f;--accent:#e6c65b;--key:#f0f1f3;--key2:#cdd1d7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#eef1f5,#d7dbe2 65%,#c9ced7);font-family:Inter,Segoe UI,Arial,sans-serif;color:#222;display:flex;align-items:center;justify-content:center;padding:22px}
.app{width:min(100%,410px);background:linear-gradient(145deg,#41444b,#17191e 55%,#30333a);padding:15px;border-radius:28px;box-shadow:0 24px 55px #252a354a,inset 0 2px 2px #ffffff55,inset 0 -3px 5px #000;position:relative}
.brand{display:flex;justify-content:space-between;align-items:flex-end;color:#e7e8ea;padding:2px 5px 10px}.brand strong{font-size:20px;letter-spacing:1.5px}.brand small{display:block;font-size:9px;letter-spacing:2px;color:#b9bdc4;margin-top:3px}.edition{font-size:10px;color:#c3c6cc}
.screen{background:linear-gradient(#d5ded8,#e3e9e2);border:5px solid #111318;border-radius:12px;padding:10px 12px;box-shadow:inset 0 2px 8px #0005,0 1px 0 #ffffff55;min-height:112px;margin-bottom:12px;color:var(--ink);position:relative}
.status{display:flex;justify-content:space-between;font-size:10px;color:#4b5a50;margin-bottom:9px}.expression{font-family:ui-monospace,Consolas,monospace;font-size:clamp(16px,4vw,21px);min-height:30px;overflow-wrap:anywhere;text-align:right}.result{font-family:ui-monospace,Consolas,monospace;font-size:28px;text-align:right;min-height:35px;overflow-wrap:anywhere}.message{font-size:11px;color:#9d2b2b;min-height:13px;text-align:right}
.modebar{display:flex;justify-content:space-between;align-items:center;color:#d6d8dc;font-size:10px;padding:0 3px 9px}.modebar button{border:0;background:transparent;color:#e6d27c;font-weight:700;cursor:pointer;padding:5px}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.key{height:49px;border:0;border-radius:10px;background:linear-gradient(#fafbfc,#d9dce1);box-shadow:0 3px 0 #8d9199,0 4px 5px #0005,inset 0 1px #fff;position:relative;color:#262a30;font-size:17px;font-weight:650;cursor:pointer;touch-action:manipulation;user-select:none}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #858992,inset 0 1px #fff}.key .sub{position:absolute;top:4px;left:5px;font-size:8px;color:#6d7d9a;font-weight:700}.key .main{display:block;padding-top:7px}.key.fn{font-size:14px}.key.op{background:linear-gradient(#d9dce2,#adb4bf)}.key.danger{background:linear-gradient(#f3d5d5,#c98989)}.key.enter{background:linear-gradient(#e8d88c,#c5a84e)}.key.wide{font-size:13px}.footer{display:flex;justify-content:space-between;color:#b8bbc2;font-size:10px;padding:13px 3px 1px}.history{display:none;background:#f8f9fb;border-radius:12px;padding:12px;margin-top:12px;max-height:230px;overflow:auto}.history.show{display:block}.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.history button{cursor:pointer}.history-item{border-top:1px solid #e2e5ea;padding:9px 2px;cursor:pointer;font-family:ui-monospace,monospace}.history-item small{display:block;color:#687384;margin-bottom:4px}.history-item strong{display:block;text-align:right;overflow-wrap:anywhere}.help{font-size:11px;line-height:1.5;color:#c6c9cf;margin:10px 3px 0}
@media(max-width:360px){body{padding:8px}.app{padding:10px;border-radius:22px}.keys{gap:6px}.key{height:44px;border-radius:8px}.screen{padding:8px}.brand strong{font-size:17px}}
</style>
</head>
<body>
<main class="app" aria-label="Scientific calculator">
<header class="brand"><div><strong>NOVACALC</strong><small>SCIENTIFIC · NATURAL DISPLAY</small></div><span class="edition">ADVANCED / 01</span></header>
<section class="screen" aria-live="polite"><div class="status"><span id="angleLabel">DEG</span><span id="memoryLabel">M —</span><span id="statusLabel">Math</span></div><div class="expression" id="expression">0</div><div class="result" id="result">0</div><div class="message" id="message"></div></section>
<div class="modebar"><span>SHIFT <span style="color:#e6d27c">●</span> &nbsp; ALPHA <span style="color:#d9a0a0">●</span></span><span><button id="angleBtn" title="Toggle degrees/radians">DEG/RAD</button><button id="historyBtn">HISTORY</button></span></div>
<section class="keys" id="keys">
<button class="key fn" data-v="sin("><span class="sub">sin⁻¹</span><span class="main">sin</span></button><button class="key fn" data-v="cos("><span class="sub">cos⁻¹</span><span class="main">cos</span></button><button class="key fn" data-v="tan("><span class="sub">tan⁻¹</span><span class="main">tan</span></button><button class="key fn" data-v="sqrt("><span class="sub">∛</span><span class="main">√</span></button><button class="key fn" data-v="^2"><span class="sub">x³</span><span class="main">x²</span></button>
<button class="key fn" data-v="log("><span class="sub">10ˣ</span><span class="main">log</span></button><button class="key fn" data-v="ln("><span class="sub">eˣ</span><span class="main">ln</span></button><button class="key fn" data-v="π"><span class="sub">CONST</span><span class="main">π</span></button><button class="key fn" data-v="e"><span class="sub">CONST</span><span class="main">e</span></button><button class="key fn" data-v="!"><span class="sub">nPr</span><span class="main">x!</span></button>
<button class="key op" data-v="(">(</button><button class="key op" data-v=")">)</button><button class="key op" data-v="^">xʸ</button><button class="key op" data-v="÷">÷</button><button class="key danger" data-action="delete">DEL</button>
<button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button><button class="key op" data-v="×">×</button><button class="key danger" data-action="clear">AC</button>
<button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button><button class="key op" data-v="−">−</button><button class="key fn" data-v="%">%</button>
<button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button><button class="key op" data-v="+">+</button><button class="key fn" data-action="ans">Ans</button>
<button class="key" data-v="0">0</button><button class="key" data-v=".">.</button><button class="key fn wide" data-v="×10^">×10ˣ</button><button class="key fn" data-action="sign">±</button><button class="key enter" data-action="equals">=</button>
</section>
<section class="history" id="history"><div class="history-head"><strong>Calculation history</strong><button id="clearHistory">Clear</button></div><div id="historyItems">No calculations yet.</div></section>
<div class="footer"><span>Natural expression input</span><span>Keyboard supported</span></div><p class="help">Tip: use your keyboard, parentheses, and functions. Example: sin(30)+log(100). This calculator runs locally in your browser.</p>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);let expr='',answer=0,memory=null,degrees=true,justEvaluated=false,history=[];
const fns=['sin','cos','tan','asin','acos','atan','sqrt','cbrt','abs','ln','log','exp','floor','ceil','round','sinh','cosh','tanh'];
function tokenize(s){s=s.replace(/×10\^/g,'*10^').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi');const re=/\s*(?:(\d+(?:\.\d*)?|\.\d+)(?:([eE][+-]?\d+))?|([A-Za-z]+)|(\*\*|[()+\-*/^!,%]))/gy;let out=[],pos=0;while(pos<s.length){re.lastIndex=pos;let m=re.exec(s);if(!m)throw Error('Invalid character');pos=re.lastIndex;out.push(m[1]!==undefined?{t:'num',v:Number(m[1]+(m[2]||''))}:m[3]?{t:'id',v:m[3].toLowerCase()}:{t:m[4],v:m[4]});}let fixed=[];for(let i=0;i<out.length;i++){let a=fixed[fixed.length-1],b=out[i];if(a&&((a.t==='num'||a.t===')'||a.t==='!'||a.t==='%'||a.t==='id'&&['pi','e','ans'].includes(a.v))&&(b.t==='num'||b.t==='('||b.t==='id'&&fns.includes(b.v))))fixed.push({t:'*',v:'*'});fixed.push(b);}return fixed}
function evaluate(s){const ts=tokenize(s);let p=0;const peek=()=>ts[p],take=()=>ts[p++],expect=t=>{if(!peek()||peek().t!==t)throw Error('Check parentheses or operator');return take()};
const primary=()=>{let t=take();if(!t)throw Error('Enter an expression');if(t.t==='num')return t.v;if(t.t==='+')return unary();if(t.t==='-')return -unary();if(t.t==='('){let v=add();expect(')');return v}if(t.t==='id'){if(t.v==='pi')return Math.PI;if(t.v==='e')return Math.E;if(t.v==='ans')return answer;if(!fns.includes(t.v))throw Error('Unknown function: '+t.v);let x;if(peek()?.t==='('){take();x=add();expect(')')}else x=unary();let a=degrees?Math.PI/180:1,b=degrees?180/Math.PI:1;let funcs={sin:x=>Math.sin(x*a),cos:x=>Math.cos(x*a),tan:x=>Math.tan(x*a),asin:x=>Math.asin(x)*b,acos:x=>Math.acos(x)*b,atan:x=>Math.atan(x)*b,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,ln:Math.log,log:Math.log10,exp:Math.exp,floor:Math.floor,ceil:Math.ceil,round:Math.round,sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh};return funcs[t.v](x)}throw Error('Unexpected token')};
const postfix=()=>{let v=primary();while(peek()&&(peek().t==='!'||peek().t==='%')){let op=take().t;if(op==='!'){if(v<0||v>170||!Number.isInteger(v))throw Error('Factorial requires an integer from 0 to 170');let n=1;for(let i=2;i<=v;i++)n*=i;v=n}else v/=100}return v};
const power=()=>{let v=postfix();if(peek()?.t==='^'||peek()?.t==='**'){take();v=Math.pow(v,unary())}return v};const unary=()=>{if(peek()?.t==='+'){take();return unary()}if(peek()?.t==='-'){take();return -unary()}return power()};
const mul=()=>{let v=unary();while(peek()&&['*','/'].includes(peek().t)){let op=take().t,b=unary();v=op==='*'?v*b:v/b}return v};
const add=()=>{let v=mul();while(peek()&&['+','-'].includes(peek().t)){let op=take().t,b=mul();v=op==='+'?v+b:v-b}return v};let v=add();if(p<ts.length)throw Error('Unexpected token');if(!Number.isFinite(v))throw Error('Math error (check domain or divide by zero)');return v}
function fmt(n){if(Object.is(n,-0))n=0;return Number(n.toPrecision(12)).toLocaleString('en-US',{useGrouping:false,maximumSignificantDigits:12})}
function render(){$('expression').textContent=expr||'0';$('angleLabel').textContent=degrees?'DEG':'RAD';$('memoryLabel').textContent=memory===null?'M —':'M '+fmt(memory)}
function insert(v){if(justEvaluated&&!['+','-','−','×','÷','^','!','%'].includes(v))expr='';justEvaluated=false;expr+=v;render();$('message').textContent=''}
function run(){try{let val=evaluate(expr);answer=val;$('result').textContent=fmt(val);$('message').textContent='';history.unshift({expr,result:fmt(val)});history=history.slice(0,100);renderHistory();justEvaluated=true}catch(e){$('message').textContent=e.message||'Invalid expression'}}
function renderHistory(){const root=$('historyItems');root.replaceChildren();if(!history.length){root.textContent='No calculations yet.';return}history.forEach(item=>{let d=document.createElement('div');d.className='history-item';let s=document.createElement('small');s.textContent=item.expr;let b=document.createElement('strong');b.textContent='= '+item.result;d.append(s,b);d.addEventListener('click',()=>{expr=item.expr;$('result').textContent=item.result;justEvaluated=true;render()});root.append(d)})}
$('keys').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let a=b.dataset.action,v=b.dataset.v;if(a==='clear'){expr='';$('result').textContent='0';$('message').textContent='';justEvaluated=false;render()}else if(a==='delete'){expr=expr.slice(0,-1);justEvaluated=false;render()}else if(a==='equals')run();else if(a==='ans')insert('Ans');else if(a==='sign'){expr=expr?'-('+expr+')':'-';render()}else insert(v)});
$('angleBtn').addEventListener('click',()=>{degrees=!degrees;render()});$('historyBtn').addEventListener('click',()=>$('history').classList.toggle('show'));$('clearHistory').addEventListener('click',()=>{history=[];renderHistory()});
document.addEventListener('keydown',e=>{if(/^[0-9.]$/.test(e.key))insert(e.key);else if(['+','-','*','/','^','(',')','!','%'].includes(e.key))insert(e.key);else if(e.key==='Enter'||e.key==='='){e.preventDefault();run()}else if(e.key==='Backspace'){expr=expr.slice(0,-1);render()}else if(e.key==='Escape'){expr='';$('result').textContent='0';render()}});render();renderHistory()})();
</script>
</body>
</html>
